name: Keep Backend Alive

on:
  schedule:
    # Ping every 14 minutes to keep Render free tier awake 24/7 (Render sleeps after 15m)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          curl -s -f -m 30 "https://barber-backend-91hy.onrender.com/" || echo "Wakeup ping triggered"
